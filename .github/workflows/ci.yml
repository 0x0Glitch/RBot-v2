name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@583939ec0c8ee9c523cc60342d3d979ce6730f38 # main
        with:
          tool: cargo-deny@0.19.8
      - run: make ci
      - name: Package immutable Linux release
        shell: bash
        run: |
          set -euo pipefail
          install -d release-artifact
          install -m 0755 target/release/morpho-v2-reallocator \
            release-artifact/morpho-v2-reallocator

          source_commit=$(git rev-parse HEAD)
          cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')
          binary_sha256=$(sha256sum release-artifact/morpho-v2-reallocator | awk '{print $1}')
          build_environment=$(rustc --version --verbose | tr '\n' ' ')

          jq -n \
            --arg source_commit "$source_commit" \
            --arg cargo_lock_sha256 "$cargo_lock_sha256" \
            --arg binary_sha256 "$binary_sha256" \
            --arg build_environment "$build_environment" \
            '{source_commit:$source_commit,cargo_lock_sha256:$cargo_lock_sha256,binary_sha256:$binary_sha256,build_environment:$build_environment}' \
            > release-artifact/release-manifest.json

          (
            cd release-artifact
            sha256sum morpho-v2-reallocator release-manifest.json > SHA256SUMS
          )
      - name: Upload immutable Linux release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: morpho-v2-reallocator-linux-x86_64
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
