name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@583939ec0c8ee9c523cc60342d3d979ce6730f38 # main
        with:
          tool: cargo-deny@0.19.8
      - name: Run complete release gate
        run: make ci
      - name: Build immutable binary
        env:
          MORPHO_V2_BUILD_REVISION: ${{ github.sha }}
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          install -d release
          install -m 0755 target/x86_64-unknown-linux-gnu/release/morpho-v2-reallocator release/morpho-v2-reallocator
          binary_sha=$(sha256sum release/morpho-v2-reallocator | awk '{print $1}')
          cargo_lock_sha=$(sha256sum Cargo.lock | awk '{print $1}')
          build_environment=$(rustc -vV | tr '\n' ';')
          jq -n \
            --arg release_version "${GITHUB_REF_NAME}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg cargo_lock_sha256 "$cargo_lock_sha" \
            --arg binary_sha256 "$binary_sha" \
            --arg build_environment "github-actions/ubuntu-24.04;$build_environment" \
            --arg build_timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{release_version:$release_version,source_commit:$source_commit,cargo_lock_sha256:$cargo_lock_sha256,binary_sha256:$binary_sha256,build_environment:$build_environment,build_timestamp:$build_timestamp}' \
            > release/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morpho-v2-reallocator-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
