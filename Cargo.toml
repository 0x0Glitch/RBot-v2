[package]
name = "morpho-v2-reallocator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

[package.metadata.cargo-machete]
# Used through serde's `with = "humantime_serde"` attribute, which static dependency
# scanners cannot resolve as a normal Rust path.
ignored = ["humantime-serde"]

[lib]
name = "morpho_v2_reallocator"
path = "src/lib.rs"

[[bin]]
name = "morpho-v2-reallocator"
path = "src/main.rs"

[dependencies]
alloy = { version = "=2.2.0", default-features = false, features = [
    "consensus",
    "consensus-secp256k1",
    "eips",
    "json",
    "provider-http",
    "provider-ws",
    "reqwest-rustls-tls",
    "rpc-types-eth",
    "signer-local",
    "sol-types",
    "std",
] }
async-trait = "0.1"
axum = "=0.8.9"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
humantime-serde = "1"
json-patch = "=4.2.0"
prometheus-client = "=0.25.0"
reqwest = { version = "=0.13.4", features = ["json"] }
sd-notify = "=0.5.0"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=1.0.1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "~1.51", features = ["full", "test-util"] }
trybuild = "1"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
redundant_clone = "warn"
float_arithmetic = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
