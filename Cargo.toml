[package]
name = "morpho-v2-reallocator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

[lib]
name = "morpho_v2_reallocator"
path = "src/lib.rs"

[[bin]]
name = "morpho-v2-reallocator"
path = "src/main.rs"

[dependencies]
alloy = { version = "=2.2.0", features = ["full"] }
async-trait = "0.1"
axum = "=0.8.9"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
humantime-serde = "1"
once_cell = "1"
prometheus-client = "=0.25.0"
rand = "0.9"
reqwest = { version = "=0.13.4", features = ["json"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "backup", "hooks", "serde_json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
zeroize = "1"

[dev-dependencies]
alloy = { version = "=2.2.0", features = ["full", "node-bindings"] }
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
proptest = "1"
tempfile = "3"
tokio = { version = "~1.51", features = ["full", "test-util"] }
trybuild = "1"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
expect_used = "deny"
float_arithmetic = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
